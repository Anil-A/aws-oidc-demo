
name: AWS OIDC S3 File Operations

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  s3-operations:
    name: Upload and List S3 Files
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      S3_BUCKET: aws-oidc-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::<replaceaccount>:role/GitHubOIDCTestRole
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Create test files
        run: |
          mkdir -p deployment
          echo "Hello AWS S3!" > deployment/hello.txt
          echo "Uploaded through GitHub Actions using OIDC." > deployment/info.txt
          echo "This is my AWS DevOps learning project." > deployment/readme.txt

      - name: Upload files to S3
        run: |
          aws s3 cp deployment/ \
            s3://$S3_BUCKET/demo/ \
            --recursive

      - name: List S3 bucket contents
        run: |
          echo "Listing S3 objects..."
          aws s3 ls s3://$S3_BUCKET/ --recursive

      - name: Download files from S3
        run: |
          mkdir -p downloaded
          aws s3 cp s3://$S3_BUCKET/demo/ \
            downloaded/ \
            --recursive

      - name: Verify downloaded files
        run: |
          diff deployment/hello.txt downloaded/hello.txt
          diff deployment/info.txt downloaded/info.txt
          diff deployment/readme.txt downloaded/readme.txt
          echo "All files successfully verified!"
