
name: AWS OIDC S3 Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-to-s3:
    name: Create S3 Bucket and Upload File
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-2
      S3_BUCKET: aws-oidc-demo-anil-a-904345768944

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::904345768944:role/GitHubOIDCTestRole
          aws-region: eu-west-2

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Create S3 bucket if it does not exist
        run: |
          if aws s3api head-bucket \
            --bucket "$S3_BUCKET" 2>/dev/null; then
            echo "Bucket already exists."
          else
            aws s3api create-bucket \
              --bucket "$S3_BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration \
              LocationConstraint="$AWS_REGION"
            echo "Bucket created successfully."
          fi

      - name: Create test file
        run: |
          echo "Hello AWS! This file was deployed using GitHub OIDC." > test-file.txt

      - name: Upload file to S3
        run: |
          aws s3 cp test-file.txt \
            s3://$S3_BUCKET/test-file.txt

      - name: List S3 bucket contents
        run: |
          echo "Listing S3 bucket contents..."
          aws s3 ls s3://$S3_BUCKET/

      - name: Verify uploaded object
        run: |
          aws s3api head-object \
            --bucket "$S3_BUCKET" \
            --key test-file.txt
